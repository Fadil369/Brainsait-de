  bpr-linkedin:
    image: brainsait/bpr-python:1.0
    container_name: bpr-linkedin
    restart: unless-stopped
    command: ["python3", "/app/services/bpr-linkedin.py"]
    ports: ["127.0.0.1:9643:9643"]
    env_file: ["/home/fadil369/.hermes/secrets/bpr-linkedin.env"]
    environment:
      BPR_LINKEDIN_DB_HOST: braincore-postgres
      BPR_LINKEDIN_DB_PORT: '5432'
