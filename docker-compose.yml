    container_name: bpr-registry-local
    restart: unless-stopped
    command: ["python3", "/app/services/bpr-registry-local.py"]
    ports: ["127.0.0.1:9642:9642"]
    env_file: ["/home/fadil369/.hermes/secrets/bpr-registry-local.env"]
    environment:
      BPR_REGISTRY_DB_HOST: braincore-postgres
      BPR_REGISTRY_DB_PORT: '5432'
    networks: ["bpr"]
    healthcheck:
      test: ["CMD","python3","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:9642/health')"]
