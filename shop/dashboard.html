<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainSAIT Shop Dashboard</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }
    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 1.875rem;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success);
      border-radius: 9999px;
      font-size: 0.875rem;
      color: var(--success);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card);
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .card-label {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .card-value {
      font-size: 2rem;
      font-weight: 700;
    }
    .card-change {
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }
    .positive { color: var(--success); }
    .negative { color: var(--danger); }
    .products-section {
      background: var(--card);
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .section-title {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
    }
    .product-item {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .product-thumb {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .product-info {
      flex: 1;
    }
    .product-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .product-price {
      color: var(--muted);
      font-size: 0.875rem;
    }
    .product-stock {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .in-stock { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .low-stock { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
    .out-of-stock { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .footer {
      margin-top: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>🛍️ BrainSAIT Shop Dashboard</h1>
      <div class="live-badge">
        <div class="live-dot"></div>
        LIVE
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-label">Total Products</div>
        <div class="card-value" id="total-products">--</div>
        <div class="card-change positive">↑ 97 products loaded</div>
      </div>
      <div class="card">
        <div class="card-label">Total Stock</div>
        <div class="card-value" id="total-stock">--</div>
        <div class="card-change muted">Items across all products</div>
      </div>
      <div class="card">
        <div class="card-label">Revenue (Mock)</div>
        <div class="card-value">SAR 0</div>
        <div class="card-change muted">First day of launch</div>
      </div>
      <div class="card">
        <div class="card-label">Orders</div>
        <div class="card-value">0</div>
        <div class="card-change muted">Awaiting first order</div>
      </div>
    </div>

    <div class="products-section">
      <div class="section-title">
        <span>📦 Top Products</span>
        <span style="font-size: 0.875rem; color: var(--muted);">Showing 97 products</span>
      </div>
      <div class="product-list" id="product-list">
        <!-- Products will be loaded here -->
      </div>
    </div>

    <div class="footer">
      Powered by BrainSAIT WooCommerce · Data refreshes every 60s
    </div>
  </div>

  <script>
    // Simulated product data (will be replaced with real WooCommerce API)
    const products = Array.from({ length: 97 }, (_, i) => ({
      id: i + 1,
      name: \`BrainSAIT Product \${i + 1}\`,
      price: (i + 1) * 100,
      stock: Math.floor(Math.random() * 100)
    }));

    function renderProducts() {
      const container = document.getElementById('product-list');
      container.innerHTML = products.slice(0, 12).map(p => \`
        <div class="product-item">
          <div class="product-thumb">📦</div>
          <div class="product-info">
            <div class="product-name">\${p.name}</div>
            <div class="product-price">SAR \${p.price}</div>
          </div>
          <div class="product-stock \${p.stock > 50 ? 'in-stock' : p.stock > 10 ? 'low-stock' : 'out-of-stock'}">
            \${p.stock} in stock
          </div>
        </div>
      \`).join('');
    }

    function updateStats() {
      document.getElementById('total-products').textContent = products.length;
      document.getElementById('total-stock').textContent = 
        products.reduce((sum, p) => sum + p.stock, 0).toLocaleString();
    }

    // Initialize
    renderProducts();
    updateStats();

    // Auto-refresh every 60 seconds
    setInterval(() => {
      updateStats();
      console.log('Dashboard refreshed:', new Date().toISOString());
    }, 60000);
  </script>
</body>
</html>
