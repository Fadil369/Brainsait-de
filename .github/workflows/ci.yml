name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build must not depend on real secrets; these are safe placeholders
          # so any accidental hard dependency surfaces here rather than in prod.
          NEXT_PUBLIC_SITE_URL: https://brainsait.de
          NODE_ENV: production
